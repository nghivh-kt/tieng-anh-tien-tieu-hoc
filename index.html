<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bé học Cấu trúc Tiếng Anh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#e8763a; --orange-d:#c85c24; --red:#d8323c; --blue:#2f8fd8;
    --ink:#22262e; --muted:#5b6270; --paper:#fffdf8; --cream:#fff4e3; --line:#f0e3cc;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:"Nunito",system-ui,sans-serif; color:var(--ink);
    background:var(--cream);
    background-image:radial-gradient(#f6dfb8 1.2px,transparent 1.2px);
    background-size:22px 22px;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:980px;margin:0 auto;padding:16px 14px 60px}

  /* Header */
  header.top{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    background:var(--orange);color:#fff;border-radius:22px;padding:14px 18px;
    box-shadow:0 6px 0 var(--orange-d);
  }
  .logo{font-family:"Baloo 2",cursive;line-height:1}
  .logo small{display:block;font-size:14px;font-weight:700;opacity:.95;letter-spacing:.5px}
  .logo b{font-size:30px;font-weight:800;color:#fff;text-shadow:2px 2px 0 var(--red)}
  .controls{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .controls label{font-size:13px;font-weight:700}
  .controls select,.controls button{
    font:inherit;font-size:14px;font-weight:700;border:0;border-radius:12px;padding:8px 10px;
    background:#fff;color:var(--ink);cursor:pointer;
  }
  .controls select{max-width:190px}

  /* Lesson tabs */
  nav.lessons{display:flex;gap:8px;overflow-x:auto;padding:16px 2px 10px;scrollbar-width:thin}
  nav.lessons button{
    flex:0 0 auto;font:inherit;font-weight:800;font-size:15px;border:2px solid var(--line);
    background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;color:var(--ink);
    display:flex;align-items:center;gap:6px
  }
  nav.lessons button .n{background:var(--orange);color:#fff;border-radius:999px;width:24px;height:24px;display:grid;place-items:center;font-size:13px}
  nav.lessons button[aria-selected="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
  nav.lessons button[aria-selected="true"] .n{background:#fff;color:var(--blue)}

  /* Page */
  .page{
    background:var(--paper);border-radius:26px;overflow:hidden;
    box-shadow:0 10px 30px rgba(120,80,20,.12);display:grid;grid-template-columns:1fr 64px;
  }
  .content{padding:22px 24px 18px}
  .side{background:var(--orange);display:flex;align-items:flex-start;justify-content:center;padding-top:20px}
  .side .day{background:var(--red);color:#fff;border-radius:10px;padding:6px 6px;font-weight:800;font-size:13px;text-align:center;line-height:1.1}

  .title-row{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap}
  .title{flex:1;min-width:220px}
  .title h1{
    margin:0;font-family:"Baloo 2",cursive;font-size:46px;line-height:1;font-weight:800;
    display:inline-block;padding:4px 14px 0;border-radius:6px;cursor:pointer;
    color:#fff;background:var(--blue);transform:rotate(-2deg);box-shadow:4px 4px 0 var(--red);
  }
  .title h1 .r{color:#ffd7d9}
  .title p{margin:10px 0 0;font-size:20px;font-weight:700;color:var(--muted)}
  .pic{
    font-size:96px;line-height:1;background:#fff;border:3px dashed var(--line);border-radius:24px;
    padding:10px 16px;display:flex;gap:4px;align-items:center
  }
  .bubbles{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .bubble{
    border:0;font:inherit;cursor:pointer;background:#eaf3fb;border-radius:30px 30px 30px 8px;
    padding:8px 16px;text-align:left;box-shadow:0 3px 0 #cfe2f2
  }
  .bubble b{font-family:"Baloo 2",cursive;font-size:24px;color:var(--red);display:block;line-height:1}
  .bubble span{font-size:13px;color:var(--muted);font-weight:700}

  /* Lines */
  ol.steps{list-style:none;margin:22px 0 10px;padding:0;display:flex;flex-direction:column;gap:10px}
  .step{
    display:grid;grid-template-columns:44px 1fr 52px;align-items:center;gap:8px;
    background:#fff;border:3px solid transparent;border-radius:20px;padding:10px 12px;cursor:pointer;
    transition:transform .12s,border-color .12s,background .12s;
    box-shadow:0 2px 0 var(--line);
  }
  .step:hover{border-color:#ffd2b4}
  .step:active{transform:scale(.985)}
  .step.speaking{border-color:var(--orange);background:#fff6ee;transform:scale(1.015)}
  .star{font-size:30px;color:var(--orange);text-align:center}
  .en{font-family:"Baloo 2",cursive;font-weight:800;line-height:1.05}
  .en .k{color:var(--red)}
  .step[data-i="0"] .en{font-size:40px}
  .step[data-i="1"] .en{font-size:44px}
  .step[data-i="2"] .en{font-size:48px}
  .step[data-i="3"] .en{font-size:54px}
  .ipa{font-size:17px;color:var(--muted);font-weight:500;font-family:"Lucida Sans Unicode","Segoe UI","Noto Sans",system-ui,sans-serif}
  .vi{font-size:19px;font-weight:700;color:#3a3f4a}
  .play{
    width:48px;height:48px;border-radius:50%;border:0;background:var(--orange);color:#fff;
    display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 0 var(--orange-d)
  }
  .play svg{width:22px;height:22px}
  .step.speaking .play{animation:pulse .8s infinite}
  @keyframes pulse{50%{transform:scale(1.12)}}
  .w{border-radius:6px;transition:background .1s}
  .w.on{background:#ffe17a}

  /* Bottom boxes */
  .boxes{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-top:16px}
  .box{background:var(--cream);border:2px dashed #e6c99a;border-radius:18px;padding:12px 14px}
  .box h3{margin:0 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:.6px;color:var(--orange-d)}
  .vocab{display:flex;flex-wrap:wrap;gap:8px}
  .vocab button{
    font:inherit;border:0;background:#fff;border-radius:12px;padding:6px 10px;cursor:pointer;
    font-weight:700;font-size:16px;box-shadow:0 2px 0 var(--line)
  }
  .vocab button b{color:var(--red)}
  .formula{font-size:18px;font-weight:800;background:#fff;border-radius:12px;padding:10px 12px;display:inline-block}
  .formula small{font-weight:600;color:var(--muted);font-size:12px}

  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  .btn{
    font:inherit;font-weight:800;font-size:17px;border:0;border-radius:16px;padding:12px 18px;cursor:pointer;
    background:var(--blue);color:#fff;box-shadow:0 4px 0 #1f6aa6
  }
  .btn.alt{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line)}
  .btn:active{transform:translateY(2px);box-shadow:none}
  .hint{margin-top:12px;font-size:14px;color:var(--muted)}
  .warn{display:none;margin-top:12px;background:#fff0f0;border:2px solid #f3c2c5;color:#8a1f26;border-radius:14px;padding:10px 14px;font-weight:700}

  /* ---------- Follow mode ---------- */
  .mic{
    width:48px;height:48px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:22px;
    display:none;place-items:center;cursor:pointer;box-shadow:0 4px 0 #a51f28
  }
  body.follow .mic{display:grid}
  body.follow .step{grid-template-columns:44px 1fr 52px 52px}
  .got{display:none;font-size:20px;letter-spacing:2px;margin-top:2px}
  body.follow .got{display:block}
  #followToggle[aria-pressed="true"]{background:var(--red);color:#fff}
  nav.lessons button .medal{font-size:15px}

  .coach{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 10px 12px;pointer-events:none}
  .coach[hidden]{display:none}
  .coach-inner{
    pointer-events:auto;max-width:760px;margin:0 auto;background:#fff;border-radius:26px;
    box-shadow:0 -4px 0 var(--orange),0 12px 40px rgba(0,0,0,.25);padding:14px 16px;
    display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;
    animation:up .25s ease-out
  }
  @keyframes up{from{transform:translateY(40px);opacity:0}}
  .coach-face{font-size:58px;text-align:center;line-height:1}
  .coach-face.bounce{animation:bounce .6s ease 2}
  @keyframes bounce{40%{transform:translateY(-14px) rotate(-8deg)}}
  .coach-msg{font-weight:800;font-size:20px}
  .coach-target{font-family:"Baloo 2",cursive;font-weight:800;font-size:30px;line-height:1.1;margin-top:2px}
  .coach-target .ok{color:#1f9d55}
  .coach-target .miss{color:var(--red);text-decoration:underline wavy}
  .coach-heard{font-size:15px;color:var(--muted);min-height:20px}
  .coach-stars{font-size:30px;letter-spacing:4px;min-height:34px}
  .coach-btns{display:flex;flex-direction:column;gap:8px;align-items:center}
  .mic.big{display:grid;width:64px;height:64px;font-size:30px}
  .mic.listening{animation:rec 1s infinite}
  @keyframes rec{0%{box-shadow:0 0 0 0 rgba(216,50,60,.6)}100%{box-shadow:0 0 0 22px rgba(216,50,60,0)}}
  .x{border:0;background:#f1f1f1;border-radius:50%;width:36px;height:36px;font-size:16px;cursor:pointer}
  .confetti{position:fixed;top:-40px;font-size:30px;z-index:30;pointer-events:none;animation:fall 1.6s ease-in forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
  body.follow .wrap{padding-bottom:180px}

  /* ---------- Game ---------- */
  nav.lessons button.game-tab{border-color:#ffd2b4;background:#fff6ee}
  nav.lessons button.game-tab[aria-selected="true"]{background:var(--red);border-color:var(--red);color:#fff}
  .game{background:var(--paper);border-radius:26px;box-shadow:0 10px 30px rgba(120,80,20,.12);padding:22px 22px 26px;text-align:center}
  .game h1{font-family:"Baloo 2",cursive;font-size:40px;margin:0;line-height:1.1;color:var(--blue)}
  .game .sub{color:var(--muted);font-weight:700;font-size:18px;margin:6px 0 16px}
  .modes{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}
  .modes button{font:inherit;font-weight:800;font-size:17px;border:3px solid var(--line);background:#fff;border-radius:16px;padding:10px 16px;cursor:pointer}
  .modes button[aria-pressed="true"]{border-color:var(--orange);background:#fff1e4}
  .dots{display:flex;gap:6px;justify-content:center;margin:4px 0 14px;flex-wrap:wrap}
  .dot{width:16px;height:16px;border-radius:50%;background:#eee3d0}
  .dot.cur{background:var(--blue);transform:scale(1.25)}
  .dot.good{background:#2fbf71}.dot.ok{background:#f2b632}
  .listen-btn{font:inherit;font-weight:800;font-size:22px;border:0;border-radius:999px;padding:14px 26px;cursor:pointer;
    background:var(--orange);color:#fff;box-shadow:0 5px 0 var(--orange-d);display:inline-flex;gap:10px;align-items:center}
  .listen-btn:active{transform:translateY(3px);box-shadow:none}
  .listen-btn.playing{animation:pulse .8s infinite}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}
  .card{border:4px solid var(--line);background:#fff;border-radius:24px;padding:14px 6px 10px;cursor:pointer;font:inherit;
    display:flex;flex-direction:column;align-items:center;gap:6px;min-height:150px;justify-content:center;transition:transform .12s}
  .card:hover{transform:translateY(-3px)}
  .card .pic{font-size:72px;line-height:1;background:none;border:0;padding:0}
  .card .lbl{font-weight:800;font-size:16px;min-height:22px;color:var(--ink)}
  .card .lbl small{display:block;font-weight:700;color:var(--muted);font-size:13px}
  .card.right{border-color:#2fbf71;background:#eafaf1;animation:pop .45s ease}
  .card.wrong{opacity:.35;animation:shake .4s;pointer-events:none}
  @keyframes pop{50%{transform:scale(1.12)}}
  @keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  .score{font-size:20px;font-weight:800;margin-top:16px;min-height:28px}
  .big-result{font-size:90px;line-height:1;margin:6px 0}

  @media (max-width:640px){
    .cards{grid-template-columns:repeat(2,1fr)}
    .card .pic{font-size:60px}
    .game h1{font-size:30px}
    body.follow .step{grid-template-columns:26px 1fr 44px 44px}
    .play,.mic{width:42px;height:42px}
    .coach-inner{grid-template-columns:52px 1fr auto;padding:12px}
    .coach-face{font-size:42px}
    .coach-target{font-size:24px}
    .page{grid-template-columns:1fr}
    .side{display:none}
    .content{padding:18px 14px}
    .title h1{font-size:36px}
    .pic{font-size:64px}
    .step{grid-template-columns:30px 1fr 46px;padding:10px 8px}
    .star{font-size:22px}
    .step[data-i="0"] .en{font-size:32px}
    .step[data-i="1"] .en{font-size:34px}
    .step[data-i="2"] .en{font-size:36px}
    .step[data-i="3"] .en{font-size:38px}
    .boxes{grid-template-columns:1fr}
    .controls{margin-left:0;width:100%}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo"><small>CẤU TRÚC</small><b>TIẾNG ANH</b><small>TIỀN TIỂU HỌC</small></div>
    <div class="controls">
      <label for="speed">Tốc độ</label>
      <select id="speed">
        <option value="0.55">🐢 Rất chậm</option>
        <option value="0.72" selected>🐰 Chậm</option>
        <option value="0.9">🦌 Vừa</option>
      </select>
      <label for="voice">Giọng</label>
      <select id="voice"><option>Đang tải…</option></select>
      <button id="viToggle" type="button" aria-pressed="false">🇻🇳 Đọc nghĩa: Tắt</button>
      <button id="followToggle" type="button" aria-pressed="false">🎤 Bé nói theo: Tắt</button>
    </div>
  </header>

  <nav class="lessons" id="tabs" role="tablist"></nav>

  <main id="page"></main>

  <div class="warn" id="warn">Trình duyệt này chưa có giọng đọc tiếng Anh. Hãy mở bằng Chrome, Safari hoặc Edge bản mới nhé.</div>
  <p class="hint" id="hint"></p>
</div>

<div class="coach" id="coach" hidden aria-live="polite">
  <div class="coach-inner">
    <div class="coach-face" id="coachFace">🐰</div>
    <div>
      <div class="coach-msg" id="coachMsg"></div>
      <div class="coach-target" id="coachTarget"></div>
      <div class="coach-heard" id="coachHeard"></div>
      <div class="coach-stars" id="coachStars"></div>
    </div>
    <div class="coach-btns">
      <button class="mic big" id="coachMic" title="Bấm để nói">🎤</button>
      <button class="x" id="coachClose" title="Đóng">✕</button>
    </div>
  </div>
</div>

<script>
const LESSONS = [
  { id:"i-see", day:1, title:["I see","..."], titleSay:"I see", vn:"Tôi thấy...", pic:["👦","🐯"],
    bubbles:[["Tiger","/ˈtaɪɡə(r)/ con hổ"],["see","/siː/ nhìn"]],
    steps:[
      {en:"I",ipa:"/aɪ/",vi:"Tôi",k:[0]},
      {en:"I see",ipa:"/aɪ siː/",vi:"Tôi thấy",k:[1]},
      {en:"I see a",ipa:"/aɪ siː ə/",vi:"Tôi thấy một",k:[2]},
      {en:"I see a tiger.",ipa:"/aɪ siː ə ˈtaɪɡər/",vi:"Tôi thấy một con hổ",k:[3]},
    ],
    vocab:[["I","tôi"],["see","nhìn thấy"],["tiger","con hổ"],["a","một"]],
    formula:"S + see + N", note:"S (chủ ngữ) · N (danh từ)" },
  { id:"a-pet", day:2, title:["A ","pet"], vn:"Một con vật cưng", pic:["👦","🐶"],
    bubbles:[["pet","/pet/ thú cưng"],["have","/hæv/ có"]],
    steps:[
      {en:"I",ipa:"/aɪ/",vi:"Tôi",k:[0]},
      {en:"I have",ipa:"/aɪ hæv/",vi:"Tôi có",k:[1]},
      {en:"I have a",ipa:"/aɪ hæv ə/",vi:"Tôi có một",k:[2]},
      {en:"I have a pet.",ipa:"/aɪ hæv ə pet/",vi:"Tôi có một con vật cưng",k:[3]},
    ],
    vocab:[["have","có"],["pet","thú cưng"]],
    formula:"S + have + N", note:"S (chủ ngữ) · N (danh từ)" },
  { id:"a-boy", day:3, title:["A ","Boy"], vn:"Một cậu bé", pic:["👦"],
    bubbles:[["Boy","/bɔɪ/ cậu bé"],["You","/juː/ bạn"]],
    steps:[
      {en:"You",ipa:"/juː/",vi:"Bạn",k:[0]},
      {en:"You are",ipa:"/juː ɑːr/",vi:"Bạn là",k:[1]},
      {en:"You are a",ipa:"/juː ɑːr ə/",vi:"Bạn là một",k:[2]},
      {en:"You are a boy.",ipa:"/juː ɑːr ə bɔɪ/",vi:"Bạn là một cậu bé",k:[3]},
    ],
    vocab:[["you","bạn"],["are","là"],["boy","cậu bé"]],
    formula:"S + be + ...", note:"be = am / is / are" },
  { id:"a-girl", day:4, title:["A ","Girl"], vn:"Một cô bé", pic:["👧"],
    bubbles:[["Girl","/ɡɜːl/ cô gái"],["am","/æm/ là"]],
    steps:[
      {en:"I",ipa:"/aɪ/",vi:"Tôi",k:[0]},
      {en:"I am",ipa:"/aɪ æm/",vi:"Tôi là",k:[1]},
      {en:"I am a",ipa:"/aɪ æm ə/",vi:"Tôi là một",k:[2]},
      {en:"I am a girl.",ipa:"/aɪ æm ə ɡɜːl/",vi:"Tôi là một cô gái",k:[3]},
    ],
    vocab:[["am","là"],["girl","cô gái"]],
    formula:"S + be + ...", note:"be = am / is / are" },
  { id:"a-dog", day:5, extra:true, title:["A ","Dog"], vn:"Một con chó", pic:["🐕"],
    bubbles:[["Dog","/dɒɡ/ con chó"],["is","/ɪz/ là"]],
    steps:[
      {en:"It",ipa:"/ɪt/",vi:"Nó",k:[0]},
      {en:"It is",ipa:"/ɪt ɪz/",vi:"Nó là",k:[1]},
      {en:"It is a",ipa:"/ɪt ɪz ə/",vi:"Nó là một",k:[2]},
      {en:"It is a dog.",ipa:"/ɪt ɪz ə dɒɡ/",vi:"Nó là một con chó",k:[3]},
    ],
    vocab:[["it","nó"],["is","là"],["dog","con chó"]],
    formula:"S + be + ...", note:"be = am / is / are" },
  { id:"apples", day:6, extra:true, title:["I like ","apples"], vn:"Tôi thích táo", pic:["👧","🍎"],
    bubbles:[["Apple","/ˈæpl/ quả táo"],["like","/laɪk/ thích"]],
    steps:[
      {en:"I",ipa:"/aɪ/",vi:"Tôi",k:[0]},
      {en:"I like",ipa:"/aɪ laɪk/",vi:"Tôi thích",k:[1]},
      {en:"I like red",ipa:"/aɪ laɪk red/",vi:"Tôi thích (quả) đỏ",k:[2]},
      {en:"I like red apples.",ipa:"/aɪ laɪk red ˈæplz/",vi:"Tôi thích những quả táo đỏ",k:[3]},
    ],
    vocab:[["like","thích"],["red","màu đỏ"],["apple","quả táo"]],
    formula:"S + like + N(s)", note:"Ns = danh từ số nhiều" },
  { id:"my-ball", day:7, extra:true, title:["My ","Ball"], vn:"Quả bóng của tôi", pic:["👦","⚽"],
    bubbles:[["Ball","/bɔːl/ quả bóng"],["my","/maɪ/ của tôi"]],
    steps:[
      {en:"This",ipa:"/ðɪs/",vi:"Đây",k:[0]},
      {en:"This is",ipa:"/ðɪs ɪz/",vi:"Đây là",k:[1]},
      {en:"This is my",ipa:"/ðɪs ɪz maɪ/",vi:"Đây là ... của tôi",k:[2]},
      {en:"This is my ball.",ipa:"/ðɪs ɪz maɪ bɔːl/",vi:"Đây là quả bóng của tôi",k:[3]},
    ],
    vocab:[["this","đây, cái này"],["my","của tôi"],["ball","quả bóng"]],
    formula:"This is + my + N", note:"N (danh từ)" },
  { id:"i-can-run", day:8, extra:true, title:["I can ","run"], vn:"Tôi có thể chạy", pic:["🏃","🐰"],
    bubbles:[["run","/rʌn/ chạy"],["can","/kæn/ có thể"]],
    steps:[
      {en:"I",ipa:"/aɪ/",vi:"Tôi",k:[0]},
      {en:"I can",ipa:"/aɪ kæn/",vi:"Tôi có thể",k:[1]},
      {en:"I can run",ipa:"/aɪ kæn rʌn/",vi:"Tôi có thể chạy",k:[2]},
      {en:"I can run fast.",ipa:"/aɪ kæn rʌn fɑːst/",vi:"Tôi có thể chạy nhanh",k:[3]},
    ],
    vocab:[["can","có thể"],["run","chạy"],["fast","nhanh"]],
    formula:"S + can + V", note:"V (động từ)" },
];

/* ---------- Speech ---------- */
const synth = window.speechSynthesis;
let voices = [], enVoice = null, viVoice = null, readVi = false, token = 0;
const PREFERRED = [
  "Google US English","Microsoft Ava Online (Natural)","Microsoft Jenny Online (Natural)",
  "Microsoft Aria Online (Natural)","Samantha","Ava","Allison","Google UK English Female",
  "Microsoft Zira","Karen","Moira","Serena","Daniel"
];
const store = {
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
};

function loadVoices(){
  if(!synth) return;
  voices = synth.getVoices();
  const en = voices.filter(v=>/^en[-_]/i.test(v.lang) || v.lang==="en");
  const sel = document.getElementById("voice");
  if(!en.length){ sel.innerHTML='<option>(chưa có)</option>'; return; }
  en.sort((a,b)=>rank(a)-rank(b));
  sel.innerHTML = en.map((v,i)=>`<option value="${i}">${v.name.replace(/Microsoft |Online |\(Natural\)/g,"").trim()} · ${v.lang}</option>`).join("");
  const saved = store.get("voiceName");
  let idx = saved ? en.findIndex(v=>v.name===saved) : -1;
  if(idx<0) idx = 0;
  sel.value = idx; enVoice = en[idx];
  sel.onchange = ()=>{ enVoice = en[+sel.value]; store.set("voiceName",enVoice.name); speakSeq([{text:"Hello! I am a girl."}]); };
  viVoice = voices.find(v=>/^vi/i.test(v.lang)) || null;
  document.getElementById("warn").style.display="none";
}
function rank(v){
  const i = PREFERRED.findIndex(p=>v.name.includes(p));
  let r = i<0 ? 100 : i;
  if(/en-US/i.test(v.lang)) r -= 0.5;
  if(/Natural|Neural|Premium|Enhanced/i.test(v.name)) r -= 20;
  return r;
}
if(synth){ loadVoices(); synth.onvoiceschanged = loadVoices; setTimeout(loadVoices,600); }
else document.getElementById("warn").style.display="block";

function rate(){ return parseFloat(document.getElementById("speed").value); }

/* items: [{text, lang:'en'|'vi', el, words}] spoken one after another */
function speakSeq(items, onDone){
  if(!synth){ document.getElementById("warn").style.display="block"; return; }
  synth.cancel(); clearHighlights();
  const my = ++token;
  let i = 0;
  const next = ()=>{
    if(my!==token) return;
    if(i>=items.length){ clearHighlights(); onDone && onDone(); return; }
    const it = items[i++];
    if(it.lang==="vi" && !viVoice){ next(); return; }
    const u = new SpeechSynthesisUtterance(it.text);
    if(it.lang==="vi"){ u.voice=viVoice; u.lang=viVoice.lang; u.rate=0.9; }
    else { if(enVoice){u.voice=enVoice; u.lang=enVoice.lang;} else u.lang="en-US"; u.rate=rate(); }
    u.pitch = 1.05;
    if(it.el) u.onstart = ()=>{ if(my===token){ clearHighlights(); it.el.classList.add("speaking"); } };
    if(it.words) u.onboundary = e=>{
      if(e.name && e.name!=="word") return;
      const ws = it.words; ws.forEach(w=>w.classList.remove("on"));
      const hit = ws.find(w=>e.charIndex>=+w.dataset.s && e.charIndex<+w.dataset.e);
      if(hit) hit.classList.add("on");
    };
    u.onend = ()=>{ if(it.words) it.words.forEach(w=>w.classList.remove("on")); setTimeout(next, it.gap ?? 350); };
    u.onerror = ()=> setTimeout(next, 100);
    synth.speak(u);
  };
  // Small delay helps Chrome/Safari after cancel()
  setTimeout(next, 60);
}
function clearHighlights(){ document.querySelectorAll(".speaking").forEach(e=>e.classList.remove("speaking")); document.querySelectorAll(".w.on").forEach(e=>e.classList.remove("on")); }

/* ---------- Render ---------- */
const esc = s => s.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';

}

/* ================= Bé nói theo (Speech Recognition) ================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let followMode = false, runId = 0, currentRec = null, audioCtx = null, coachCtx = null;

// Words speech engines often hear instead of what a child says
const HOMO = {
  eye:"i", aye:"i", ai:"i", hi:"i", high:"i", ay:"i",
  sea:"see", c:"see", si:"see", seeing:"see",
  u:"you", yu:"you", ya:"you", r:"are", our:"are",
  uh:"a", ah:"a", an:"a", the:"a",
  doug:"dog", dug:"dog", dogs:"dog", boi:"boy", boys:"boy", girls:"girl", gal:"girl",
  pets:"pet", tigers:"tiger", apple:"apples", ran:"run", running:"run", balls:"ball", bowl:"ball",
  half:"have", has:"have", ken:"can", cant:"can", dis:"this", these:"this",
  fest:"fast", read:"red", ham:"am", em:"am", m:"am", itt:"it"
};
const CONTRACT = { "i'm":"i am", "im":"i am", "it's":"it is", "its":"it is", "you're":"you are", "youre":"you are", "that's":"that is" };

function normWords(text){
  const raw = (text||"").toLowerCase().replace(/[’`]/g,"'").replace(/[^a-z' ]/g," ").split(/\s+/).filter(Boolean);
  const out = [];
  raw.forEach(w=>{ const c = CONTRACT[w]; (c ? c.split(" ") : [w.replace(/'/g,"")]).forEach(x=>out.push(HOMO[x]||x)); });
  return out;
}
function targetWords(en){ return en.toLowerCase().replace(/[^a-z' ]/g," ").split(/\s+/).filter(Boolean); }

/* grade one transcript against target sentence */
function gradeOne(en, heardText){
  const tw = targetWords(en);
  const pool = normWords(heardText);
  const hit = tw.map(t=>{
    const k = pool.findIndex(h=> h===t || (t.length>3 && (h===t+"s" || h+"s"===t)));
    if(k>=0){ pool.splice(k,1); return true; }
    return false;
  });
  const content = tw.map((t,i)=>({t,ok:hit[i]})).filter(x=>x.t!=="a");   // "a" is often swallowed
  const frac = content.length ? content.filter(x=>x.ok).length / content.length : 0;
  let stars = frac===1 ? 3 : frac>=0.66 ? 2 : frac>=0.34 ? 1 : 0;
  // Single word "I" is very hard for engines: any clear speech counts as a good try
  if(tw.length===1 && stars===0 && normWords(heardText).length) stars = 2;
  return {hit, stars, frac, heard: heardText};
}
function grade(en, alts){
  let best = {hit:targetWords(en).map(()=>false), stars:0, frac:0, heard:alts[0]||""};
  alts.forEach(a=>{ const g = gradeOne(en,a); if(g.stars>best.stars || (g.stars===best.stars && g.frac>best.frac)) best = g; });
  return best;
}

/* stars storage */
const starKey = (id,i)=>`stars:${id}:${i}`;
function getStars(id,i){ return +(store.get(starKey(id,i))||0); }
function setStars(id,i,n){ if(n>getStars(id,i)) store.set(starKey(id,i), String(n)); }
function starStr(n){ return "⭐".repeat(n) + "☆".repeat(3-n); }
function lessonDone(L){ return L.steps.every((_,i)=>getStars(L.id,i)>=2); }

/* little "ting" so the child knows it's their turn */
function ting(){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime;
    o.type="sine"; o.frequency.setValueAtTime(880,t); o.frequency.setValueAtTime(1320,t+0.09);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.25,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.3);
    o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t+0.32);
  }catch(e){}
}
function confetti(){
  const set = ["🎉","⭐","🌟","🎈","💖","✨"];
  for(let i=0;i<22;i++){
    const s = document.createElement("span"); s.className="confetti";
    s.textContent = set[i%set.length];
    s.style.left = Math.random()*100+"vw"; s.style.animationDelay = Math.random()*0.4+"s";
    document.body.appendChild(s); setTimeout(()=>s.remove(), 2200);
  }
}
const sleep = ms => new Promise(r=>setTimeout(r,ms));
function say(items){ return new Promise(res=> speakSeq(items, res)); }

/* ----- coach panel ----- */
const $ = id => document.getElementById(id);
function showCoach({face="🐰", msg="", target="", heard="", stars=""}){
  $("coach").hidden = false;
  $("coachFace").textContent = face; $("coachMsg").textContent = msg;
  $("coachTarget").innerHTML = target; $("coachHeard").textContent = heard; $("coachStars").textContent = stars;
}
function hideCoach(){ $("coach").hidden = true; }
function setListening(on){ $("coachMic").classList.toggle("listening", on); document.querySelectorAll(".step .mic").forEach(m=>m.classList.remove("listening")); }
function plainTarget(en){ return esc(en); }
function markedTarget(en, hit){ return en.split(" ").map((w,i)=>`<span class="${hit[i]?"ok":"miss"}">${esc(w)}</span>`).join(" "); }

const ERR = {
  "not-allowed": "Micro đang bị chặn. Hãy cho phép dùng micro (biểu tượng 🔒 / 🎤 trên thanh địa chỉ).",
  "service-not-allowed": "Trình duyệt không cho dùng nhận giọng nói ở đây. Hãy mở trang trực tiếp bằng Chrome hoặc Safari.",
  "audio-capture": "Không tìm thấy micro trên máy.",
  "network": "Cần có Internet để máy nghe được giọng bé.",
  "no-speech": "Cô chưa nghe thấy bé nói. Bé nói to hơn một chút nhé!",
};

function listen(){
  return new Promise(resolve=>{
    let r;
    try{ r = new SR(); }catch(e){ resolve({alts:[], err:"service-not-allowed"}); return; }
    r.lang = "en-US"; r.interimResults = true; r.maxAlternatives = 5; r.continuous = false;
    let finals = [], interim = "", done = false;
    const finish = err => {
      if(done) return; done = true; clearTimeout(timer); currentRec = null; setListening(false);
      try{ r.abort(); }catch(e){}
      const alts = finals.length ? finals : (interim ? [interim] : []);
      resolve({alts, err: alts.length ? null : (err || "no-speech")});
    };
    r.onresult = e=>{
      interim = "";
      for(let i=0;i<e.results.length;i++){
        const res = e.results[i];
        if(res.isFinal){ for(let j=0;j<res.length;j++) finals.push(res[j].transcript); }
        else interim += res[0].transcript;
      }
      $("coachHeard").textContent = "👂 " + (interim || finals[0] || "");
    };
    r.onerror = e=> finish(e.error);
    r.onend = ()=> finish();
    const timer = setTimeout(()=>{ try{ r.stop(); }catch(e){} }, 7000);
    try{ r.start(); currentRec = r; setListening(true); }
    catch(e){ finish("service-not-allowed"); }
  });
}

function stopPractice(){
  runId++; token++;
  if(currentRec){ try{ currentRec.abort(); }catch(e){} currentRec = null; }
  synth && synth.cancel(); clearHighlights(); setListening(false);
}

const PRAISE3 = [["Excellent!","Giỏi quá! 🎉"],["Great job!","Tuyệt vời! 🌟"],["Wonderful!","Bé đọc hay lắm! 💖"],["Super!","Xuất sắc! 🏆"]];
const PRAISE2 = [["Good job!","Tốt lắm! Gần hoàn hảo rồi 👍"],["Well done!","Giỏi lắm! Thêm chút nữa là 3 sao 😊"]];
const TRY     = [["Try again!","Bé thử lại nhé! 💪"],["Let's try again!","Cố lên, mình đọc lại nào! 🙂"]];
const pick = a => a[Math.floor(Math.random()*a.length)];

/* one line: (model) → ting → listen → grade → praise. Returns stars or null */
async function practice(L, i, el, withModel){
  if(!SR){ showCoach({face:"🙈", msg:"Trình duyệt này chưa hỗ trợ nghe giọng nói.", heard:"Hãy dùng Chrome (máy tính/Android) hoặc Safari (iPhone/iPad)."}); return null; }
  stopPractice();
  try{ audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); audioCtx.resume(); }catch(e){}
  const run = runId, s = L.steps[i];
  coachCtx = {L, i, el};
  const words = [...el.querySelectorAll(".w")];
  if(withModel){
    showCoach({face:"🐰", msg:"Bé nghe cô đọc nhé…", target:plainTarget(s.en)});
    await say([{text:s.en, lang:"en", el, words}]);
    if(run!==runId) return null;
    await sleep(250);
  }
  showCoach({face:"🎤", msg:"Đến lượt bé! Đọc to nào:", target:plainTarget(s.en), heard:"👂 Cô đang nghe…"});
  el.classList.add("speaking"); el.querySelector(".mic").classList.add("listening");
  ting(); await sleep(350);
  if(run!==runId) return null;
  const res = await listen();
  el.classList.remove("speaking");
  if(run!==runId) return null;

  if(res.err){
    showCoach({face:"🤔", msg: ERR[res.err] || "Có lỗi khi nghe, bé thử lại nhé.", target:plainTarget(s.en),
      heard: (res.err==="not-allowed"||res.err==="service-not-allowed") && window.self!==window.top
        ? "Nếu đang xem trong Claude: khung xem này không cho dùng micro — hãy mở file HTML trực tiếp bằng Chrome/Safari." : "Bấm 🎤 để thử lại."});
    return null;
  }
  const g = grade(s.en, res.alts);
  setStars(L.id, i, g.stars);
  el.querySelector(".got").textContent = starStr(getStars(L.id,i));
  const [en, vi] = g.stars===3 ? pick(PRAISE3) : g.stars===2 ? pick(PRAISE2) : pick(TRY);
  showCoach({ face: g.stars>=2 ? "🥳" : "🐰", msg: vi, target: markedTarget(s.en, g.hit),
              heard: "Bé đã nói: “" + g.heard.trim() + "”", stars: starStr(g.stars) });
  if(g.stars>=2){ $("coachFace").classList.remove("bounce"); void $("coachFace").offsetWidth; $("coachFace").classList.add("bounce"); }
  if(g.stars===3) confetti();
  await say([{text:en, lang:"en"}]);
  if(lessonDone(L)) renderTabs(L.id);
  return g.stars;
}

async function practiceAll(L, stepEls){
  for(let i=0;i<stepEls.length;i++){
    let st = await practice(L, i, stepEls[i], true);
    if(st===null) return;
    if(st<2){ await sleep(600); st = await practice(L, i, stepEls[i], true); if(st===null) return; }
    await sleep(900);
  }
  const total = L.steps.reduce((a,_,i)=>a+getStars(L.id,i),0);
  showCoach({face:"🏆", msg:`Hoàn thành bài! Bé được ${total}/12 sao`, stars: total>=10 ? "🎉🎉🎉" : "👏👏"});
  if(total>=10) confetti();
  await say([{text: total>=10 ? "Amazing! You did it!" : "Good job! Let's practice again!", lang:"en"}]);
}

$("coachMic").onclick = ()=>{
  if(currentRec){ try{ currentRec.stop(); }catch(e){} return; }
  if(coachCtx) practice(coachCtx.L, coachCtx.i, coachCtx.el, false);
};
$("coachClose").onclick = ()=>{ stopPractice(); hideCoach(); };

const ft = $("followToggle");
function setFollow(on){
  followMode = on; document.body.classList.toggle("follow", on);
  ft.setAttribute("aria-pressed", on); ft.textContent = "🎤 Bé nói theo: " + (on?"Bật":"Tắt");
  store.set("follow", on?"1":"0");
}
ft.onclick = ()=>{
  setFollow(!followMode); render();
  if(followMode){
    let note = "";
    if(!SR) note = "Trình duyệt này chưa hỗ trợ nghe giọng nói. Hãy dùng Chrome hoặc Safari.";
    else if(document.featurePolicy && !document.featurePolicy.allowsFeature("microphone"))
      note = "Khung xem này chặn micro. Hãy tải file HTML và mở trực tiếp bằng Chrome/Safari để bé nói theo.";
    showCoach({face:"🐰", msg:"Chế độ Bé nói theo đã bật!", heard: note || "Bấm vào một dòng để bắt đầu nhé."});
  }
};
setFollow(store.get("follow")==="1");

/* ================= Trò chơi: nghe rồi chọn đúng hình ================= */
const GAME_ID = "tro-choi";
const ROUNDS = 10;
// g = nhóm nghĩa: hai thẻ cùng nhóm không bao giờ xuất hiện chung (vd. dog / pet)
const G_WORDS = [
  {say:"tiger", pic:"🐯", vi:"con hổ",   g:"tiger"},
  {say:"dog",   pic:"🐕", vi:"con chó",  g:"dog"},
  {say:"pet",   pic:"🐶", vi:"thú cưng", g:"dog"},
  {say:"boy",   pic:"👦", vi:"cậu bé",   g:"boy"},
  {say:"girl",  pic:"👧", vi:"cô gái",   g:"girl"},
  {say:"apple", pic:"🍎", vi:"quả táo",  g:"apple"},
  {say:"ball",  pic:"⚽", vi:"quả bóng", g:"ball"},
  {say:"run",   pic:"🏃", vi:"chạy",     g:"run"},
  {say:"see",   pic:"👀", vi:"nhìn thấy",g:"see"},
];
const G_SENTS = [
  {say:"I see a tiger.",     pic:"👀🐯", vi:"Tôi thấy một con hổ",       g:"tiger"},
  {say:"I have a pet.",      pic:"🐶",   vi:"Tôi có một con vật cưng",   g:"dog"},
  {say:"It is a dog.",       pic:"🐕",   vi:"Nó là một con chó",         g:"dog"},
  {say:"You are a boy.",     pic:"👦",   vi:"Bạn là một cậu bé",         g:"boy"},
  {say:"I am a girl.",       pic:"👧",   vi:"Tôi là một cô gái",         g:"girl"},
  {say:"I like red apples.", pic:"🍎🍎", vi:"Tôi thích những quả táo đỏ", g:"apple"},
  {say:"This is my ball.",   pic:"⚽",   vi:"Đây là quả bóng của tôi",   g:"ball"},
  {say:"I can run fast.",    pic:"🏃💨", vi:"Tôi có thể chạy nhanh",     g:"run"},
];
let game = null, gameMode = store.get("gameMode") || "mix";

const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

function buzz(){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime;
    o.type="triangle"; o.frequency.setValueAtTime(220,t); o.frequency.linearRampToValueAtTime(150,t+0.25);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.2,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.3);
    o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t+0.32);
  }catch(e){}
}

function buildQuestions(){
  const qs = [];
  let lastG = null;
  for(let r=0;r<ROUNDS;r++){
    const useSent = gameMode==="sent" || (gameMode==="mix" && r%2===1);
    const pool = useSent ? G_SENTS : G_WORDS;
    // tránh lặp lại cùng nhóm ở 2 câu liền nhau, và hạn chế lặp mục đã hỏi
    const asked = new Set(qs.map(q=>q.target.say));
    let cand = pool.filter(x=>x.g!==lastG && !asked.has(x.say));
    if(!cand.length) cand = pool.filter(x=>x.g!==lastG);
    const target = cand[Math.floor(Math.random()*cand.length)];
    const used = new Set([target.g]), opts = [target];
    for(const x of shuffle(pool)){ if(opts.length>=4) break; if(!used.has(x.g)){ used.add(x.g); opts.push(x); } }
    qs.push({target, opts: shuffle(opts), tries:0, done:false});
    lastG = target.g;
  }
  return qs;
}

function renderGame(){
  $("hint").innerHTML = "🎮 Bé bấm <b>🔊 Nghe</b>, rồi chạm vào hình đúng. Chọn đúng ngay lần đầu được 1 ⭐.";
  const best = +(store.get("gameBest:"+gameMode)||0);
  $("page").innerHTML = `
  <section class="game">
    <h1>🎧 Nghe và chọn hình</h1>
    <p class="sub">Bé nghe thật kỹ rồi chọn đúng hình nhé!</p>
    <div class="modes" role="group" aria-label="Chọn kiểu chơi">
      <button data-m="word" aria-pressed="${gameMode==="word"}">🔤 Nghe từ</button>
      <button data-m="sent" aria-pressed="${gameMode==="sent"}">💬 Nghe câu</button>
      <button data-m="mix"  aria-pressed="${gameMode==="mix"}">🎲 Trộn</button>
    </div>
    <div class="big-result">🐰</div>
    <p class="sub">${ROUNDS} câu hỏi${best?` · Kỷ lục: ${best}/${ROUNDS} ⭐`:""}</p>
    <button class="listen-btn" id="gStart">▶ Bắt đầu chơi</button>
  </section>`;
  document.querySelectorAll(".modes button").forEach(b=> b.onclick = ()=>{ gameMode=b.dataset.m; store.set("gameMode",gameMode); renderGame(); });
  $("gStart").onclick = ()=>{
    try{ audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); audioCtx.resume(); }catch(e){}
    game = {qs: buildQuestions(), idx:0, score:0, busy:false};
    showQuestion();
  };
}

function playTarget(){
  const q = game && game.qs[game.idx], btn = $("gListen");
  if(!q || q.done) return;
  btn && btn.classList.add("playing");
  speakSeq([{text:q.target.say, lang:"en", gap:0}], ()=> btn && btn.classList.remove("playing"));
}

function showQuestion(){
  const q = game.qs[game.idx];
  $("page").innerHTML = `
  <section class="game">
    <div class="dots">${game.qs.map((x,i)=>`<span class="dot ${i===game.idx?"cur":x.done?(x.tries===1?"good":"ok"):""}"></span>`).join("")}</div>
    <p class="sub">Câu ${game.idx+1}/${ROUNDS} · ${q.target.say.includes(" ")?"Nghe câu":"Nghe từ"}</p>
    <button class="listen-btn" id="gListen">🔊 Nghe</button>
    <div class="cards">
      ${q.opts.map((o,i)=>`<button class="card" data-i="${i}" aria-label="Hình ${i+1}"><span class="pic">${o.pic}</span><span class="lbl"></span></button>`).join("")}
    </div>
    <div class="score">⭐ ${game.score}</div>
  </section>`;
  $("gListen").onclick = playTarget;
  document.querySelectorAll(".card").forEach(c=> c.onclick = ()=> answer(c, q.opts[+c.dataset.i]));
  setTimeout(playTarget, 350);
}

async function answer(card, opt){
  if(game.busy) return;
  const q = game.qs[game.idx];
  q.tries++;
  if(opt.say !== q.target.say){
    card.classList.add("wrong"); buzz();
    speakSeq([{text:"Oops! Listen again.", lang:"en", gap:200}, {text:q.target.say, lang:"en"}]);
    return;
  }
  game.busy = true; q.done = true;
  if(q.tries===1){ game.score++; }
  card.classList.add("right");
  card.querySelector(".lbl").innerHTML = `${esc(opt.say)}<small>${esc(opt.vi)}</small>`;
  document.querySelectorAll(".card:not(.right)").forEach(c=>c.style.pointerEvents="none");
  ting();
  if(q.tries===1) confettiSmall(card);
  $$score();
  const praise = q.tries===1 ? pick(["Great!","Excellent!","Yes! Well done!","Super!"]) : "Good!";
  const lb = $("gListen"); if(lb) lb.disabled = true;
  // chờ đọc xong, nhưng tối đa 6 giây để không bao giờ bị kẹt
  await Promise.race([ say([{text:praise, lang:"en", gap:150}, {text:q.target.say, lang:"en", gap:500}]), sleep(6000) ]);
  game.busy = false;
  game.idx++;
  if(game.idx < ROUNDS) showQuestion(); else showResult();
}
function $$score(){ const s=document.querySelector(".game .score"); if(s) s.textContent = "⭐ " + game.score; }
function confettiSmall(card){
  const r = card.getBoundingClientRect();
  for(let i=0;i<8;i++){
    const s = document.createElement("span"); s.className="confetti"; s.textContent = pick(["⭐","✨","🌟"]);
    s.style.left = (r.left + Math.random()*r.width)+"px"; s.style.top = r.top+"px"; s.style.animationDuration = "1.1s";
    document.body.appendChild(s); setTimeout(()=>s.remove(), 1300);
  }
}

function showResult(){
  const s = game.score, key = "gameBest:"+gameMode;
  const isBest = s > +(store.get(key)||0); if(isBest) store.set(key, String(s));
  const face = s>=9 ? "🏆" : s>=7 ? "🥳" : s>=5 ? "😊" : "💪";
  const msg  = s>=9 ? "Xuất sắc! Bé nghe giỏi quá!" : s>=7 ? "Giỏi lắm! Sắp được điểm tối đa rồi!" : s>=5 ? "Tốt lắm! Chơi thêm lần nữa nhé!" : "Cố lên! Bé ôn lại bài rồi chơi tiếp nhé!";
  $("page").innerHTML = `
  <section class="game">
    <div class="dots">${game.qs.map(x=>`<span class="dot ${x.tries===1?"good":"ok"}"></span>`).join("")}</div>
    <div class="big-result">${face}</div>
    <h1>${s}/${ROUNDS} ⭐</h1>
    <p class="sub">${msg}${isBest?"<br>🎉 Kỷ lục mới!":""}</p>
    <div class="actions" style="justify-content:center">
      <button class="listen-btn" id="gAgain">🔁 Chơi lại</button>
      <button class="btn alt" id="gMenu">Đổi kiểu chơi</button>
    </div>
  </section>`;
  if(s>=7) confetti();
  say([{text: s>=9 ? "Amazing! You are a super listener!" : s>=5 ? "Good job! Let's play again!" : "Nice try! Let's practice more!", lang:"en"}]);
  $("gAgain").onclick = ()=>{ game = {qs: buildQuestions(), idx:0, score:0, busy:false}; showQuestion(); };
  $("gMenu").onclick = renderGame;
}

/* settings */
const spd = document.getElementById("speed");
const savedSpd = store.get("speed"); if(savedSpd) spd.value = savedSpd;
spd.onchange = ()=>{ store.set("speed",spd.value); speakSeq([{text:"I see a tiger."}]); };
const vt = document.getElementById("viToggle");
function setVi(on){ readVi=on; vt.setAttribute("aria-pressed",on); vt.textContent = "🇻🇳 Đọc nghĩa: " + (on?"Bật":"Tắt"); store.set("readVi",on?"1":"0"); }
setVi(store.get("readVi")==="1");
vt.onclick = ()=>{ setVi(!readVi); if(readVi && !viVoice){ vt.textContent="🇻🇳 Máy chưa có giọng Việt"; } };

window.addEventListener("hashchange", render);
render();
</script>
